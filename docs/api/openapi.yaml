openapi: 3.0.3
info:
  title: API de Gestión de Recursos Humanos y Recursos Corporativos (ERP-RRHH)
  description: |
    Especificación formal **API-First** bajo **OpenAPI 3.0.3** para el Sistema ERP de Gestión de Recursos Humanos.
    
    ### Estándares Internacionales Aplicados:
    - **RFC 9110 (HTTP Semantics):** Uso semántico de métodos HTTP (`GET`, `POST`, `PUT`, `PATCH`, `DELETE`), cabeceras de caché (`X-Cache`, `X-Cache-TTL`) y códigos de respuesta.
    - **RFC 9457 (Problem Details for HTTP APIs):** Todas las respuestas de error (`400`, `401`, `403`, `404`, `409`, `500`) se retornan bajo el Media Type oficial `application/problem+json` con estructura unificada (`type`, `title`, `status`, `detail`, `instance`, `code`, `timestamp`, `errors`).
    - **Persistencia Políglota:** PostgreSQL (Transaccional ACID), MongoDB (Expedientes Documentales y Auditoría), Redis (Patrón Cache-Aside con TTL = 300s/600s) y Neo4j (Grafo Jerárquico Organizacional).
    - **Interoperabilidad Multi-Protocolo (GraphQL & gRPC):**
      - *Federación GraphQL:* El endpoint `/api/graphql` (conceptual) permite proyectar en una sola consulta el expediente de PostgreSQL, las competencias de MongoDB y los subordinados de Neo4j evitando *over-fetching*.
      - *Comunicación Interna gRPC:* Los cálculos masivos de planilla e impuestos (`PayrollCalculationService.CalculateBatch`) están modelados mediante contratos Protocol Buffers (`proto3`) sobre HTTP/2 para baja latencia inter-servicios.
  version: 2.0.0
  contact:
    name: Paul Dominguez (9989-23-9308), Jorge Morataya (9989-23-340) & Britany Yamileth Meza Chinchilla (9989-23-3181) - Universidad Mariano Gálvez
    email: pdominguezr@miumg.edu.gt
servers:
  - url: http://localhost:3000/api/v1
    description: Servidor Local de Desarrollo y Pruebas Funcionales (Next.js 16)
  - url: https://api.rrhh.umg.edu.gt/api/v1
    description: Servidor de Producción / Staging

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: Autenticación y generación de Token JWT
      description: |
        Autentica las credenciales institucionales contra **PostgreSQL**, registra la sesión activa en **Redis** (`TTL = 3600s`) y emite una traza en **MongoDB**. En caso de fallo, responde con estructura **RFC 9457 (`application/problem+json`)**.
      operationId: loginUser
      security: []
      tags:
        - Autenticación (PostgreSQL + Redis)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            examples:
              adminValido:
                summary: Credenciales de Administrador RRHH
                value:
                  email: "admin.rrhh@empresa.com"
                  password: "Password123!"
              credencialesInvalidas:
                summary: Ejemplo que dispara Error 401 RFC 9457
                value:
                  email: "admin.rrhh@empresa.com"
                  password: "ClaveErronea!"
      responses:
        '200':
          description: Autenticación exitosa y emisión de JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          $ref: '#/components/responses/ProblemBadRequest400'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized401'
        '403':
          $ref: '#/components/responses/ProblemForbidden403'
        '500':
          $ref: '#/components/responses/ProblemInternalError500'

  /recursos:
    get:
      summary: Consulta de catálogo con caché (Patrón Cache-Aside)
      description: |
        Retorna el catálogo paginado y filtrado de recursos/colaboradores.
        Aplica el patrón **Cache-Aside** en **Redis** con política de expiración `TTL = 300 segundos`, combinando datos relacionales de **PostgreSQL** con documentos de **MongoDB** y jerarquía de **Neo4j**.
      operationId: getRecursosCatalogo
      tags:
        - Recursos Políglotas (Redis + MongoDB + PostgreSQL + Neo4j)
      parameters:
        - name: departamento
          in: query
          description: Filtrar por departamento funcional
          required: false
          schema:
            type: string
            example: "Tecnología"
        - name: estado
          in: query
          description: Filtrar por estado operativo
          required: false
          schema:
            type: string
            enum: [ACTIVO, INACTIVO, SUSPENDIDO]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        '200':
          description: Catálogo recuperado exitosamente (con cabeceras X-Cache HIT/MISS).
          headers:
            X-Cache:
              description: Indica si la respuesta provino de Redis (HIT) o de PostgreSQL/MongoDB (MISS).
              schema:
                type: string
                enum: [HIT, MISS]
            X-Cache-TTL:
              description: Tiempo de vida restante en segundos de la clave en Redis.
              schema:
                type: integer
                example: 300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecursoListResponse'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized401'
        '500':
          $ref: '#/components/responses/ProblemInternalError500'

    post:
      summary: Registro de nuevo elemento (PostgreSQL + Neo4j + MongoDB)
      description: |
        Registra transaccionalmente un nuevo recurso/colaborador en **PostgreSQL**, publica un evento en el `DomainEventBus` (Patrón **Observer**) que crea el nodo jerárquico en **Neo4j**, inserta el expediente/auditoría en **MongoDB** e invalida el caché en **Redis**.
      operationId: createRecurso
      tags:
        - Recursos Políglotas (Redis + MongoDB + PostgreSQL + Neo4j)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpleadoCreateRequest'
            examples:
              recursoValido:
                summary: Registro válido de recurso corporativo
                value:
                  nombres: "Elena Sofía"
                  apellidos: "Méndez Castillo"
                  email: "elena.mendez@empresa.com"
                  dpi: "2540198270101"
                  departamento: "Tecnología"
                  puesto: "Arquitecta de Soluciones Cloud"
                  salario_base: 19500.00
                  regimen: "ASALARIADO"
                  estado: "ACTIVO"
      responses:
        '201':
          description: Recurso creado y sincronizado en la arquitectura políglota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecursoCreatedResponse'
        '400':
          $ref: '#/components/responses/ProblemBadRequest400'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized401'
        '500':
          $ref: '#/components/responses/ProblemInternalError500'

  /recursos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador UUID o código correlativo (ej. EMP-001) del recurso
        schema:
          type: string
          example: "EMP-001"
    get:
      summary: Detalle de elemento por ID (Redis + PostgreSQL + Neo4j)
      description: |
        Recupera el expediente integral de un recurso por su ID o código, protegido por **Cache-Aside** (`TTL = 600s`) y patrón **Circuit Breaker**. Si no existe, retorna `404 Not Found` bajo **RFC 9457 (`application/problem+json`)**.
      operationId: getRecursoById
      tags:
        - Recursos Políglotas (Redis + MongoDB + PostgreSQL + Neo4j)
      responses:
        '200':
          description: Recurso encontrado exitosamente.
          headers:
            X-Cache:
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoResponse'
        '404':
          $ref: '#/components/responses/ProblemNotFound404'
        '500':
          $ref: '#/components/responses/ProblemInternalError500'

  /empleados:
    get:
      summary: Listar colaboradores (con Cache-Aside)
      operationId: getEmpleados
      tags:
        - Empleados
      parameters:
        - name: estado
          in: query
          schema:
            type: string
            enum: [ACTIVO, INACTIVO, SUSPENDIDO]
        - name: departamento
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Listado paginado de colaboradores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecursoListResponse'
        '500':
          $ref: '#/components/responses/ProblemInternalError500'

    post:
      summary: Crear un nuevo colaborador
      operationId: createEmpleado
      tags:
        - Empleados
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpleadoCreateRequest'
      responses:
        '201':
          description: Colaborador creado satisfactoriamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoResponse'
        '400':
          $ref: '#/components/responses/ProblemBadRequest400'
        '500':
          $ref: '#/components/responses/ProblemInternalError500'

  /empleados/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Obtener detalle de colaborador por ID
      operationId: getEmpleadoById
      tags:
        - Empleados
      responses:
        '200':
          description: Expediente encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoResponse'
        '404':
          $ref: '#/components/responses/ProblemNotFound404'

  /solicitudes:
    get:
      summary: Listar solicitudes de ausencia
      operationId: getSolicitudes
      tags:
        - Solicitudes de Ausencia
      responses:
        '200':
          description: Listado de solicitudes obtenido exitosamente.
    post:
      summary: Registrar solicitud de ausencia
      operationId: createSolicitud
      tags:
        - Solicitudes de Ausencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudAusenciaCreateRequest'
      responses:
        '201':
          description: Solicitud radicada en estado PENDIENTE.
        '400':
          $ref: '#/components/responses/ProblemBadRequest400'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT emitido por POST /api/v1/auth/login.

  responses:
    ProblemBadRequest400:
      description: Error de validación de datos o regla de negocio (RFC 9110 / RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://erp-rrhh.umg.edu.gt/probs/validation-error"
            title: "Violación de Reglas de Validación de Negocio (RFC 9457)"
            status: 400
            detail: "El salario base no puede ser inferior al mínimo legal vigente de Q 3,384.59"
            instance: "/api/v1/recursos"
            code: "VALIDATION_ERROR"
            timestamp: "2026-10-19T21:50:00.000Z"
            errors:
              salario_base:
                - "El salario base no puede ser inferior al mínimo legal vigente de Q 3,384.59"

    ProblemUnauthorized401:
      description: Credenciales inválidas o token JWT ausente/expirado (RFC 9110 / RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://erp-rrhh.umg.edu.gt/probs/unauthorized"
            title: "Credenciales de Acceso Inválidas"
            status: 401
            detail: "Credenciales inválidas. Por favor verifique su correo institucional y contraseña."
            instance: "/api/v1/auth/login"
            code: "UNAUTHORIZED"
            timestamp: "2026-10-19T21:50:00.000Z"

    ProblemForbidden403:
      description: Cuenta inactiva o permisos insuficientes para la operación (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ProblemNotFound404:
      description: Recurso no encontrado en el sistema (RFC 9110 / RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://erp-rrhh.umg.edu.gt/probs/resource-not-found"
            title: "Recurso o Colaborador No Encontrado"
            status: 404
            detail: "No existe ningún recurso registrado con el identificador 'EMP-9999' en PostgreSQL."
            instance: "/api/v1/recursos/EMP-9999"
            code: "RESOURCE_NOT_FOUND"
            timestamp: "2026-10-19T21:50:00.000Z"

    ProblemInternalError500:
      description: Error inesperado en el servidor o motor de persistencia (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      description: Estructura estándar RFC 9457 (Problem Details for HTTP APIs).
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
          example: "https://erp-rrhh.umg.edu.gt/probs/validation-error"
        title:
          type: string
          example: "Violación de Reglas de Validación de Negocio"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Uno o más campos del recurso no cumplen las restricciones del contrato."
        instance:
          type: string
          example: "/api/v1/recursos"
        code:
          type: string
          example: "VALIDATION_ERROR"
        timestamp:
          type: string
          format: date-time
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "admin.rrhh@empresa.com"
        password:
          type: string
          minLength: 6
          example: "Password123!"

    AuthLoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: "AUTH_SUCCESS"
        message:
          type: string
          example: "Autenticación exitosa"
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                email:
                  type: string
                nombre:
                  type: string
                rol:
                  type: string
            token:
              type: string
            expiresIn:
              type: integer
              example: 3600

    EmpleadoCreateRequest:
      type: object
      required:
        - nombres
        - apellidos
        - dpi
        - departamento
        - puesto
        - salario_base
      properties:
        nombres:
          type: string
          example: "Carlos Roberto"
        apellidos:
          type: string
          example: "Morales Gómez"
        email:
          type: string
          format: email
          example: "cmorales@empresa.com"
        dpi:
          type: string
          minLength: 13
          maxLength: 13
          example: "2450198270101"
        departamento:
          type: string
          example: "Tecnología"
        puesto:
          type: string
          example: "Ingeniero de Software Senior"
        salario_base:
          type: number
          format: double
          minimum: 3384.59
          example: 18500.00
        regimen:
          type: string
          enum: [ASALARIADO, SERVICIOS_PROFESIONALES, EJECUTIVO]
          default: ASALARIADO
        fecha_contratacion:
          type: string
          format: date
          example: "2026-02-01"
        estado:
          type: string
          enum: [ACTIVO, INACTIVO, SUSPENDIDO]
          default: ACTIVO

    EmpleadoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          example: "EMP-001"
        dpi:
          type: string
          example: "2450198270101"
        nombres:
          type: string
        apellidos:
          type: string
        correo:
          type: string
        departamento:
          type: string
        puesto:
          type: string
        salario_base:
          type: number
        estado:
          type: string
        expediente_mongodb:
          type: object
          nullable: true
          description: Datos documentales provenientes de MongoDB
        jerarquia_neo4j:
          type: object
          nullable: true
          description: Relaciones de grafo provenientes de Neo4j
        proyeccion_nomina_strategy:
          type: object
          description: Desglose salarial calculado mediante Patrón Strategy

    RecursoListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmpleadoResponse'
        pagination:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
            totalPages:
              type: integer
        cache_metadata:
          type: object
          properties:
            pattern:
              type: string
              example: "Cache-Aside"
            status:
              type: string
              enum: [HIT, MISS]
            ttl_seconds:
              type: integer
              example: 300

    RecursoCreatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: "CREATED"
        message:
          type: string
        data:
          $ref: '#/components/schemas/EmpleadoResponse'
        polyglot_sync:
          type: object
          properties:
            postgresql:
              type: string
              example: "COMMITTED_ACID"
            neo4j_graph:
              type: string
              example: "NODE_AND_RELATIONS_MERGED"
            mongodb_audit:
              type: string
              example: "DOCUMENT_INSERTED"
            redis_cache:
              type: string
              example: "INVALIDATED_LIST_KEYS"

    SolicitudAusenciaCreateRequest:
      type: object
      required:
        - empleado_id
        - tipo
        - fecha_inicio
        - fecha_fin
        - motivo
      properties:
        empleado_id:
          type: string
        tipo:
          type: string
          enum: [PERMISO, VACACIONES, ENFERMEDAD, OTRO]
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        motivo:
          type: string
